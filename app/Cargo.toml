[package]
name = "demo"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2.3.0"
prometheus = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
