# rules.yaml is generated in CI from the spec of prometheusrule.yaml,
# so the test always runs against the rules the cluster loads.
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # Test 1: 50% error rate series triggering the page-level burn-rate alert after 2 minutes
  - interval: 1m
    input_series:
      - series: 'http_requests_total{route="/",method="GET",status="200"}'
        values: '0+150x70'
      - series: 'http_requests_total{route="/",method="GET",status="500"}'
        values: '0+150x70'
    alert_rule_test:
      - eval_time: 1m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts: []
      - eval_time: 2m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts: []
      - eval_time: 3m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Demo service error budget burn rate high (page-level)"
              description: "The 1h error ratio and 5m error ratio both exceed 14.4x burn rate (14.4% errors). At this rate, the monthly error budget will be exhausted in ~2 days. See runbook at docs/slo.md#runbook-high-burn-rate-page."
              runbook_url: "https://github.com/mattDev0/k3s-gitops-lab/blob/main/docs/slo.md#runbook-high-burn-rate-page"

  # Test 2: 0.5% error rate series staying quiet (below 1% error budget, no alerts fire)
  - interval: 1m
    input_series:
      - series: 'http_requests_total{route="/",method="GET",status="200"}'
        values: '0+199x70'
      - series: 'http_requests_total{route="/",method="GET",status="500"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts: []
      - eval_time: 65m
        alertname: DemoServiceErrorBudgetBurnRateSlow
        exp_alerts: []

  # Test 3: no 5xx series exists yet (a healthy service); the ratio must be 0, not empty
  - interval: 1m
    input_series:
      - series: 'http_requests_total{route="/",method="GET",status="200"}'
        values: '0+150x70'
    promql_expr_test:
      - expr: job:http_requests_error_ratio:rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'job:http_requests_error_ratio:rate5m'
            value: 0
    alert_rule_test:
      - eval_time: 65m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts: []
