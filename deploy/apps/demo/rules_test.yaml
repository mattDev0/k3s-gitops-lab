rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # Test 1: 50% error rate series triggering the page-level burn-rate alert after 2 minutes
  - interval: 1m
    input_series:
      - series: 'http_requests_total{route="/",method="GET",status="200"}'
        values: '0+150x70'
      - series: 'http_requests_total{route="/",method="GET",status="500"}'
        values: '0+150x70'
    alert_rule_test:
      - eval_time: 1m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts: []
      - eval_time: 2m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts: []
      - eval_time: 3m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: "Demo service error budget burn rate high (page-level)"
              description: "The 1h error ratio and 5m error ratio both exceed 14.4x burn rate (14.4% errors). At this rate, the monthly error budget will be exhausted in ~2 days. See runbook at docs/slo.md#runbook-high-burn-rate-page."
              runbook_url: "docs/slo.md#runbook-high-burn-rate-page"

  # Test 2: 0.5% error rate series staying quiet (below 1% error budget, no alerts fire)
  - interval: 1m
    input_series:
      - series: 'http_requests_total{route="/",method="GET",status="200"}'
        values: '0+199x70'
      - series: 'http_requests_total{route="/",method="GET",status="500"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: DemoServiceErrorBudgetBurnRateHigh
        exp_alerts: []
      - eval_time: 65m
        alertname: DemoServiceErrorBudgetBurnRateSlow
        exp_alerts: []
